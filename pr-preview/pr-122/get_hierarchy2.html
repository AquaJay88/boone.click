<!DOCTYPE html>
<html>
<head>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    gltfLoader.load('/store/images/Train Case & Hub Animation.glb', (gltf) => {
      const model = gltf.scene;

      const parts = {};

      // I want to log the number of vertices or some characteristic of each mesh
      // since the names are stripped. Or wait, maybe the names are stored in userData.name?
      model.traverse(node => {
        if (node.isMesh) {
          console.log(`Mesh: ${node.name}, userData.name: ${node.userData.name}, children: ${node.children.length}, verts: ${node.geometry.attributes.position.count}`);
        }
      });

    }, undefined, (err) => {
      console.error(err);
    });
  </script>
</body>
</html>
