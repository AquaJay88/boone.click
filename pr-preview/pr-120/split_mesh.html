<!DOCTYPE html>
<html>
<head>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    gltfLoader.load('/store/images/Train Case & Hub Animation.glb', (gltf) => {
      const model = gltf.scene;

      console.log('nodes in gltf.scene:', model.children.length);
      model.children.forEach(c => console.log('child name:', c.name, 'type:', c.type));

      // Let's log the materials array or what is in the glTF parser
      console.log("nodes:", gltf.parser.json.nodes);
      console.log("meshes:", gltf.parser.json.meshes);
      console.log("materials:", gltf.parser.json.materials);

    }, undefined, (err) => {
      console.error(err);
    });
  </script>
</body>
</html>
