<!DOCTYPE html>
<html>
<head>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    gltfLoader.load('/store/images/Train Case & Hub Animation.glb', (gltf) => {
      const parts = gltf.scene.children;
      let trainMesh = parts[2]; // mesh_2, 2670 verts
      let hubMesh = parts[3];   // mesh_3, 13557 verts
      let tiesMesh = parts[0];  // mesh_0, 1408 verts
      let railsMesh = parts[1]; // mesh_1, 246368 verts

      console.log('trainMesh positions:', trainMesh.geometry.attributes.position.count);
      console.log('tiesMesh positions:', tiesMesh.geometry.attributes.position.count);

    }, undefined, (err) => {
      console.error(err);
    });
  </script>
</body>
</html>
