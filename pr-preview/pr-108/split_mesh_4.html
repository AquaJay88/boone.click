<!DOCTYPE html>
<html>
<head>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    gltfLoader.load('/store/images/Train Case & Hub Animation.glb', (gltf) => {
      // Analyze colors from materials to identify them
      const materials = gltf.parser.json.materials;
      console.log('--- Material Base Colors ---');
      materials.forEach((m, idx) => {
         const color = m.pbrMetallicRoughness.baseColorFactor;
         console.log(`Material ${idx}: rgb(${color[0].toFixed(3)}, ${color[1].toFixed(3)}, ${color[2].toFixed(3)})`);
      });
      // The materials output from previously:
      // Material 0: rgb(0.056, 0.024, 0.012) -> Chocolate Brown (Ties)
      // Material 1: rgb(0.352, 0.352, 0.352) -> Light Grey (Rails)
      // Material 2: rgb(0.352, 0.352, 0.371) -> Almost Grey (Train?)
      // Material 3: rgb(0.000, 0.000, 0.000) -> Black (Hub)

      // In glTF, meshes use these materials.
      const meshes = gltf.parser.json.meshes;
      console.log('--- Mesh Materials ---');
      meshes.forEach((m, idx) => {
         console.log(`Mesh ${idx} uses Material ${m.primitives[0].material}`);
      });
      // Mesh 0 uses Material 0 (Ties)
      // Mesh 1 uses Material 1 (Rails)
      // Mesh 2 uses Material 2 (Train)
      // Mesh 3 uses Material 3 (Hub)

      console.log("This confirms the identity of the 4 merged meshes!");

    }, undefined, (err) => {
      console.error(err);
    });
  </script>
</body>
</html>
