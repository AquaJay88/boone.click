<!DOCTYPE html>
<html>
<head>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    gltfLoader.load('/store/images/Train Case & Hub Animation.glb', (gltf) => {
      const model = gltf.scene;

      function printHierarchy(node, depth = 0) {
        console.log(' '.repeat(depth * 2) + node.name + ' (' + node.type + ')');
        node.children.forEach(child => printHierarchy(child, depth + 1));
      }
      console.log('--- SCENE GRAPH ---');
      printHierarchy(model);
      console.log('--- END SCENE GRAPH ---');
    }, undefined, (err) => {
      console.error(err);
    });
  </script>
</body>
</html>
