<!DOCTYPE html>
<html>
<head>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    gltfLoader.load('/store/images/Train Case & Hub Animation.glb', (gltf) => {
      // Iterate nodes to check what they are.
      // mesh_0: vertex count 1408
      // mesh_1: vertex count 246368
      // mesh_2: vertex count 2670
      // mesh_3: vertex count 13557

      console.log('nodes length:', gltf.scene.children.length);

      const parts = gltf.scene.children;
      for (let i = 0; i < parts.length; i++) {
         console.log('mesh_' + i, parts[i].geometry.attributes.position.count);
      }
    }, undefined, (err) => {
      console.error(err);
    });
  </script>
</body>
</html>
