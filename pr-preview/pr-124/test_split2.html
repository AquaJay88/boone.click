<!DOCTYPE html>
<html>
<head>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    gltfLoader.load('/store/images/Train Case & Hub Animation.glb', (gltf) => {
      let tiesMesh = gltf.scene.children[0];

      function splitMeshIntoSeparateMeshes(mesh) {
        const geom = mesh.geometry;
        const positions = geom.attributes.position.array;
        const normals = geom.attributes.normal ? geom.attributes.normal.array : null;
        const indices = geom.index.array;

        // Find connected components in the index buffer
        const numVerts = geom.attributes.position.count;
        const adj = new Array(numVerts).fill(null).map(() => []);

        for(let i=0; i<indices.length; i+=3) {
           const a = indices[i], b = indices[i+1], c = indices[i+2];
           adj[a].push(b, c);
           adj[b].push(a, c);
           adj[c].push(a, b);
        }

        const visited = new Uint8Array(numVerts);
        const components = [];

        for(let i=0; i<numVerts; i++) {
           if(!visited[i]) {
              const compVerts = new Set([i]);
              const q = [i];
              visited[i] = 1;

              while(q.length > 0) {
                 const curr = q.pop();
                 const neighbors = adj[curr];
                 for(let j=0; j<neighbors.length; j++) {
                    const n = neighbors[j];
                    if(!visited[n]) {
                       visited[n] = 1;
                       compVerts.add(n);
                       q.push(n);
                    }
                 }
              }
              components.push(compVerts);
           }
        }

        console.log(`Found ${components.length} components`);

        // Build new meshes
        const meshes = [];
        components.forEach(comp => {
            const vMap = new Map();
            const newPos = [];
            const newNorm = [];

            let newIdxCounter = 0;
            comp.forEach(oldIdx => {
                vMap.set(oldIdx, newIdxCounter++);
                newPos.push(positions[oldIdx*3], positions[oldIdx*3+1], positions[oldIdx*3+2]);
                if (normals) {
                    newNorm.push(normals[oldIdx*3], normals[oldIdx*3+1], normals[oldIdx*3+2]);
                }
            });

            const newIndices = [];
            for(let i=0; i<indices.length; i+=3) {
                const a = indices[i], b = indices[i+1], c = indices[i+2];
                if(comp.has(a)) { // If one vertex is in, the whole triangle is in
                    newIndices.push(vMap.get(a), vMap.get(b), vMap.get(c));
                }
            }

            const newGeom = new THREE.BufferGeometry();
            newGeom.setAttribute('position', new THREE.Float32BufferAttribute(newPos, 3));
            if (normals) {
                newGeom.setAttribute('normal', new THREE.Float32BufferAttribute(newNorm, 3));
            }
            newGeom.setIndex(newIndices);

            const newMesh = new THREE.Mesh(newGeom, mesh.material);

            // Re-center geometry
            newGeom.computeBoundingBox();
            const center = newGeom.boundingBox.getCenter(new THREE.Vector3());
            newGeom.translate(-center.x, -center.y, -center.z);
            newMesh.position.copy(center);

            meshes.push(newMesh);
        });

        return meshes;
      }

      const parts = splitMeshIntoSeparateMeshes(tiesMesh);
      console.log('Built', parts.length, 'meshes');

      const model = new THREE.Group();
      parts.forEach(p => model.add(p));
      console.log('model children', model.children.length);

    }, undefined, (err) => {
      console.error(err);
    });
  </script>
</body>
</html>
