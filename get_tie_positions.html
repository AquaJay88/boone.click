<!DOCTYPE html>
<html>
<head>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    gltfLoader.load('/store/images/Train Case & Hub Animation.glb', (gltf) => {
      const parts = gltf.scene.children;
      let tiesMesh = parts[0];  // 1408 verts

      console.log('tiesMesh isMesh?', tiesMesh.isMesh);
      console.log('verts:', tiesMesh.geometry.attributes.position.count);
      console.log('indices:', tiesMesh.geometry.index ? tiesMesh.geometry.index.count : 'None');

      // Is it a bunch of disconnected triangles?
      // 1408 verts / 8 (vertices for a box) = 176 boxes?
      // 1408 / 4 = 352?

      console.log('index buffer type:', tiesMesh.geometry.index.array.constructor.name);

    }, undefined, (err) => {
      console.error(err);
    });
  </script>
</body>
</html>
