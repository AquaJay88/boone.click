<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave a Review | Boone Store</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="cart.js" type="text/javascript"></script>
</head>
<body>

<div class="main-content-wrapper">
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container store-nav-container">
      <!-- Centered Logo -->
      <div class="nav-logo store-nav-logo">
        <a href="index.html" style="color: inherit; text-decoration: none; font-size: 1.5rem;">
          <img src="../images/JB Red.png" alt="JB Logo" style="height: 1.5em; margin-right: 0.5em; vertical-align: middle;"><span class="craftsman-font" style="vertical-align: middle;">Craftsman</span>
        </a>
      </div>
      <!-- Right-aligned links -->
      <div class="nav-links store-nav-links">
        <a href="index.html" class="nav-link">Store</a>
        <a href="about.html" class="nav-link">About Us</a>
        <a href="contact.html" class="nav-link">Contact Us</a>
        <a href="cart.html" class="nav-link" style="position: relative; display: inline-flex; align-items: center;">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="nav-cart-badge" id="navCartBadge" style="display: none; position: absolute; top: -8px; right: -12px; background: var(--primary-color); color: white; font-size: 0.65rem; font-weight: bold; height: 18px; min-width: 18px; border-radius: 9px; align-items: center; justify-content: center; padding: 0 4px;">0</span>
        </a>
      </div>
    </div>
  </nav>

  <div class="container" style="position: relative;">

    <!-- Hero Section -->
    <div class="hero-wrapper" style="min-height: 40vh;">

      <!-- Drifting Ribbon Background -->
      <div class="ribbon-background">
        <div class="ribbon-blob ribbon-blob-1"></div>
        <div class="ribbon-blob ribbon-blob-2"></div>
        <div class="ribbon-blob ribbon-blob-3"></div>
        <div class="ribbon-texture"></div>
      </div>

      <section class="hero container" style="padding-top: 100px; padding-bottom: 50px;">
        <div class="hero-text-grid" style="grid-template-columns: 1fr; text-align: center;">
          <div class="hero-text" style="max-width: 800px; margin: 0 auto;">
            <h1 style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: clamp(3rem, 6vw, 5rem);">
              <span class="craftsman-font" style="color: var(--primary-color);">Leave a Review</span>
            </h1>
            <span class="tagline" style="color: var(--text-secondary); font-size: clamp(1.2rem, 2vw, 1.5rem); margin-top: 1rem; display: block;">
              We value your feedback. Let us know how we did!
            </span>
          </div>
        </div>
      </section>
    </div>

    <!-- Form Section -->
    <div class="bento-grid content-layer" style="margin-top: -50px; position: relative; z-index: 10; justify-content: center; display: flex;">

      <!-- Centered Form Column -->
      <div class="col-span-8" style="width: 100%; max-width: 800px;">
        <div class="bento-card" style="position: relative; padding: 2rem;">
          <h2 class="section-title" style="margin-top: 0;">Review Details</h2>
          <!-- Hidden iframe for background submission -->
          <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) {showThankYou();}"></iframe>

          <form action="https://docs.google.com/forms/d/e/1FAIpQLSc3qSKzh2Wc78w8fSzEqi74vDTU_bJ4cFIO5DAIMc704r-dBQ/formResponse" method="POST" target="hidden_iframe" onsubmit="submitted=true;" class="contact-form" id="reviewForm">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="entry.633351163" placeholder="John Boone" required>
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="entry.1974821270" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
              <label for="productSelect">Product Name</label>
              <select id="productSelect" name="entry.53541266" required style="width: 100%; padding: 0.85rem; border: 1px solid var(--border-light); border-radius: var(--radius-md); background-color: var(--bg-color); color: var(--text-primary); font-family: inherit; font-size: 1rem; transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;">
                <option value="" disabled selected>Select a product</option>
                <!-- Options populated by Supabase -->
              </select>
            </div>

            <div class="form-group">
              <label>Stars</label>
              <div id="starRatingContainer" style="display: flex; gap: 0.5rem; font-size: 1.5rem; color: #ccc; cursor: pointer;">
                <i class="fa-regular fa-star star-icon" data-value="1"></i>
                <i class="fa-regular fa-star star-icon" data-value="2"></i>
                <i class="fa-regular fa-star star-icon" data-value="3"></i>
                <i class="fa-regular fa-star star-icon" data-value="4"></i>
                <i class="fa-regular fa-star star-icon" data-value="5"></i>
              </div>
              <input type="hidden" id="starsInput" name="entry.1771557850" required>
            </div>

            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="entry.2007012643" placeholder="What did you think of the product?" style="min-height: 150px;" required></textarea>
            </div>

            <button type="submit" class="btn" style="width: 100%;">Submit Review</button>
          </form>

          <!-- Thank You Overlay -->
          <div class="thank-you-overlay" id="thankYouOverlay">
            <h3>Thank You!</h3>
            <p>Your review has been submitted.</p>
            <button type="button" class="reset-form-btn" onclick="resetForm()">Submit Another Review</button>
          </div>
        </div>
      </div>

    </div>

  </div>

  <footer style="text-align: center; padding: 2rem;">
    <a href="about.html" class="btn btn-secondary" style="display: inline-block;">Learn about my small business</a>
  </footer>
</div> <!-- End of .main-content-wrapper -->

  <!-- Floating Cart Menu -->
  <div class="floating-cart" id="floatingCartMenu">
    <div class="cart-background">
      <div class="cart-blob cart-blob-1"></div>
      <div class="cart-blob cart-blob-2"></div>
      <div class="cart-blob cart-blob-3"></div>
      <div class="cart-texture"></div>
    </div>

    <div class="cart-content-wrapper">
      <button class="cart-toggle-btn" id="cartToggleBtn" aria-label="Toggle Cart">
        <i class="fa-solid fa-cart-shopping open-icon"></i>
        <i class="fa-solid fa-xmark close-icon"></i>
        <span class="cart-badge" id="cartBadge">0</span>
      </button>

      <div class="cart-dropdown-inner" id="cartDropdownInner">
        <h3 class="cart-title">
          <span>Your Cart</span>
          <span class="cart-total" id="cartTotal" style="display: block; font-size: 1.1rem; color: var(--primary-color);">Total: $0.00</span>
        </h3>
        <div class="cart-items" id="cartItems">
          <!-- Items will be injected here by cart.js -->
        </div>
        <div class="cart-footer">

          <button class="btn btn-checkout" id="checkoutBtn">Checkout</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Page Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    // Variable to track if form was submitted
    var submitted = false;

    // Function to handle showing the thank you overlay
    function showThankYou() {
      // Show the overlay
      document.getElementById('thankYouOverlay').classList.add('active');
      // Reset the submitted flag
      submitted = false;
    }

    // Function to handle resetting the form
    function resetForm() {
      // Clear the form fields
      document.getElementById('reviewForm').reset();
      // Hide the overlay
      document.getElementById('thankYouOverlay').classList.remove('active');

      // Reset star UI
      const stars = document.querySelectorAll('.star-icon');
      stars.forEach(s => {
        s.classList.remove('fa-solid');
        s.classList.add('fa-regular');
        s.style.color = '#ccc';
      });
      document.getElementById('starsInput').value = '';
      // Dispatch custom event so the logic below resets the `selectedRating` internal state
      document.dispatchEvent(new Event('resetStars'));
    }

    // Star Rating Logic
    document.addEventListener('DOMContentLoaded', () => {
      const stars = document.querySelectorAll('.star-icon');
      const starsInput = document.getElementById('starsInput');
      let selectedRating = 0;

      function updateStars(rating, isHover = false) {
        stars.forEach(star => {
          const starValue = parseInt(star.getAttribute('data-value'));
          if (starValue <= rating) {
            star.classList.remove('fa-regular');
            star.classList.add('fa-solid');
            star.style.color = 'var(--primary-color)';
          } else {
            star.classList.remove('fa-solid');
            star.classList.add('fa-regular');
            star.style.color = '#ccc';
          }
        });
      }

      stars.forEach(star => {
        star.addEventListener('mouseover', function() {
          const rating = parseInt(this.getAttribute('data-value'));
          updateStars(rating, true);
        });

        star.addEventListener('mouseout', function() {
          updateStars(selectedRating);
        });

        star.addEventListener('click', function() {
          selectedRating = parseInt(this.getAttribute('data-value'));
          starsInput.value = selectedRating;
          updateStars(selectedRating);
        });
      });

      document.addEventListener('resetStars', () => {
        selectedRating = 0;
      });
    });

    // Fetch products from Supabase
    document.addEventListener('DOMContentLoaded', async () => {
      const productSelect = document.getElementById('productSelect');

      try {
        const { data: products, error } = await window.supabaseClient
          .from('product')
          .select('name');

        if (error) {
          console.error('Error fetching products:', error);
          return;
        }

        // Extract unique product names and sort alphabetically
        const uniqueNames = [...new Set(products.map(p => p.name))];
        uniqueNames.sort((a, b) => a.localeCompare(b));

        // Populate the select dropdown
        uniqueNames.forEach(name => {
          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          productSelect.appendChild(option);
        });
      } catch (err) {
        console.error('Unexpected error loading products:', err);
      }
    });

  </script>

</body>
</html>
